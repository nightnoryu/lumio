apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: lumio
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [lumio-web, lumio-worker]
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lumio
spec:
  groups:
    - name: lumio
      rules:
        - alert: LumioUploadFailures
          expr: sum(increase(lumio_media_operations_total{namespace="lumio",operation=~"upload_create|upload_complete",outcome="error"}[10m])) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Lumio upload API operations are failing
            description: Check web logs and PostgreSQL/MinIO availability. Browser PUT failures require ingress logs or pilot reports.
        - alert: LumioProcessingFailures
          expr: sum(increase(lumio_media_operations_total{namespace="lumio",operation="process",outcome=~"error|exhausted"}[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: Lumio image processing failed
            description: Check worker logs, memory limits, storage availability and failed photo records.
        - alert: LumioMetricsUnavailable
          expr: up{namespace="lumio",pod=~"lumio-(web|worker)-.*"} == 0 or absent(up{namespace="lumio",pod=~"lumio-web-.*"}) or absent(up{namespace="lumio",pod=~"lumio-worker-.*"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Lumio web or worker metrics are unavailable
