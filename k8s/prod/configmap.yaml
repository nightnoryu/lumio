apiVersion: v1
kind: ConfigMap
metadata:
  name: lumio-config
  labels:
    app.kubernetes.io/component: prerequisite
data:
  LUMIO_BASE_DOMAIN: "lumio.ru"
  LUMIO_DASHBOARD_ORIGIN: "https://app.lumio.ru"
  LUMIO_SERVE_REST_ADDRESS: ":8080"
  LUMIO_METRICS_ADDRESS: ":9090"
  LUMIO_DB_HOST: "postgres"
  LUMIO_DB_PORT: "5432"
  LUMIO_DB_NAME: "lumio"
  LUMIO_DB_USER: "lumio"
  LUMIO_DB_MAX_CONN: "10"
  LUMIO_DB_CONN_LIFETIME: "60s"
  LUMIO_S3_ENDPOINT: "http://minio:9000"
  LUMIO_S3_PUBLIC_ENDPOINT: "https://s3.lumio.ru"
  LUMIO_S3_REGION: "us-east-1"
  LUMIO_S3_BUCKET: "lumio"
  # k3s default pod CIDR; change to match the actual cluster. NetworkPolicy restricts ingress peers.
  LUMIO_TRUSTED_PROXY_CIDRS: "10.42.0.0/16"
