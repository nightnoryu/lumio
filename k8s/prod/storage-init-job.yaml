apiVersion: batch/v1
kind: Job
metadata:
  name: lumio-storage-init
  labels:
    app.kubernetes.io/component: storage-init
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: lumio-storage-init
        app.kubernetes.io/component: storage-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storage-init
          image: lumio-web
          args: [storage-init]
          envFrom:
            - configMapRef:
                name: lumio-config
          env:
            - name: LUMIO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: LUMIO_DB_PASSWORD
            - name: LUMIO_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: LUMIO_S3_ACCESS_KEY
            - name: LUMIO_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: LUMIO_S3_SECRET_KEY
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
