apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: lumiopho.com
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: '*.lumiopho.com'
    traefik.ingress.kubernetes.io/router.middlewares: lumio-compress@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: 'lumiopho.com'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lumio-web
                port:
                  number: 8080
    - host: 'app.lumiopho.com'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lumio-web
                port:
                  number: 8080
    - host: '*.lumiopho.com'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lumio-web
                port:
                  number: 8080
