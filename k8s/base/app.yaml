apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumio-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lumio-web
  template:
    metadata:
      labels:
        app: lumio-web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: lumio-web
          envFrom:
            - configMapRef:
                name: lumio-config
          env:
            - name: LUMIO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: LUMIO_DB_PASSWORD
            - name: LUMIO_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: LUMIO_S3_ACCESS_KEY
            - name: LUMIO_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: LUMIO_S3_SECRET_KEY
          ports:
            - name: metrics
              containerPort: 9090
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumio-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lumio-worker
  template:
    metadata:
      labels:
        app: lumio-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: lumio-worker
          envFrom:
            - configMapRef:
                name: lumio-config
          env:
            - name: LUMIO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: LUMIO_DB_PASSWORD
            - name: LUMIO_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: LUMIO_S3_ACCESS_KEY
            - name: LUMIO_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lumio-secrets
                  key: LUMIO_S3_SECRET_KEY
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lumio-web
spec:
  selector:
    app: lumio-web
  ports:
    - name: http
      port: 8080
      targetPort: http
