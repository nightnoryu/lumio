[tools]
go = "1.26.8"
golangci-lint = "2.12.2"
"go:github.com/ogen-go/ogen/cmd/ogen" = "1.24.0"
node = "26.8.1"
pnpm = "12.3.1"

[env]
GOOS = "linux"
GOARCH = "amd64"
CGO_ENABLED = "0"

[tasks.default]
run = [
    { task = "build" },
    { task = "check" },
]

# Local environment

[tasks.dev]
depends = [ "backend:build" ]
run = "docker compose up -d --wait"

[tasks."dev:reload"]
depends = [ "backend:build" ]
run = "docker compose restart lumio lumio-worker"

[tasks."dev:rebuild"]
depends = [ "backend:build" ]
run = "docker compose up -d --wait --build"

[tasks."dev:down"]
run = "docker compose down"

[tasks."dev:ps"]
run = "docker compose ps"

[tasks."dev:logs"]
run = "docker compose logs -f"

# Builds

[tasks.build]
run = [
    { task = "backend:build" },
]

[tasks."backend:tidy"]
dir = "backend"
run = "go mod tidy"

[tasks."backend:modules"]
dir = "backend"
run = "go mod download"

[tasks."backend:generate"]
run = """ogen --clean \
--target ./backend/api/server/publicapi \
--package publicapi \
--config ./backend/api/server/publicapi/.ogen.yml \
./api/publicapi.yml"""
sources = [
    "api/publicapi.yml",
    "backend/api/server/publicapi/.ogen.yml",
]
outputs = [ "backend/api/server/publicapi/*_gen.go" ]

[tasks."backend:build"]
dir = "backend"
depends = [ "backend:generate", "backend:modules", "web:build" ]
run = "go build -trimpath -v -o ./bin/lumio ./cmd/lumio"
sources = [
    "go.*",
    "**/*.go",
    "data/migrations/*.up.sql",
    "internal/webui/dist/**/*",
]
outputs = [ "bin/lumio" ]

[tasks."web:modules"]
dir = "web"
run = "pnpm install --frozen-lockfile"

[tasks."web:build"]
dir = "web"
depends = [ "web:modules" ]
run = "pnpm run build"

# Checks

[tasks.check]
run = [
    { task = "test" },
    { task = "lint" },
]

# Tests

[tasks.test]
run = [
    { task = "backend:test:unit" },
    { task = "web:test" },
]

[tasks."backend:test:unit"]
dir = "backend"
depends = [ "backend:generate", "web:build" ]
run = "go test ./..."

[tasks."web:test"]
dir = "web"
run = "pnpm run test"

# Linting

[tasks.lint]
run = [
    { task = "backend:lint" },
    { task = "web:lint" },
]

[tasks."backend:lint"]
dir = "backend"
depends = [ "backend:generate", "web:build" ]
run = [ "golangci-lint run --build-tags e2e", "golangci-lint fmt --diff" ]

[tasks."web:lint"]
dir = "web"
depends = [ "web:modules" ]
run = [ "pnpm exec tsc --noEmit", "pnpm run lint" ]

[tasks."web:generate"]
dir = "web"
depends = [ "web:modules" ]
run = "pnpm run generate"

[tasks."backend:test:e2e"]
dir = "backend"
depends = [ "backend:generate" ]
run = "go test -tags e2e ./test/e2e/..."

[tasks."backend:test:media"]
dir = "backend"
depends = [ "backend:build" ]
run = [
    "docker build -f Dockerfile.worker -t lumio-worker-test .",
    "go test -c -o bin/imaging.test ./internal/infrastructure/imaging",
    "docker run --rm -v $(pwd)/bin/imaging.test:/tests:ro --entrypoint /tests lumio-worker-test -test.v",
]
