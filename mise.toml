[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
"go:github.com/ogen-go/ogen/cmd/ogen" = "1.24.0"
node = "26.8.1"
pnpm = "12.3.1"
sops = "3.13.3"
age = "1.3.2"
ksops = "4.5.1"
kustomize = "5.8.3"
kubectl = "1.37.0"
kubeconform = "0.8.0"

# Generators and installers may leave unchanged outputs with old mtimes.
[settings]
task.source_freshness_hash_contents = true

[env]
GOOS = "linux"
GOARCH = "amd64"
CGO_ENABLED = "0"

# Keep shared prerequisites in one DAG so mise executes each task only once.
[tasks.default]
depends = [ "build", "check" ]

# Local environment

[tasks.dev]
depends = [ "backend:build" ]
run = "docker compose up -d --wait"

[tasks."dev:reload"]
depends = [ "backend:build" ]
run = "docker compose restart lumio lumio-worker"

[tasks."dev:rebuild"]
depends = [ "backend:build" ]
run = "docker compose up -d --wait --build"

[tasks."dev:down"]
run = "docker compose down"

[tasks."dev:ps"]
run = "docker compose ps"

[tasks."dev:logs"]
run = "docker compose logs -f"

# Builds

[tasks.build]
depends = [ "backend:build" ]

[tasks."backend:tidy"]
dir = "backend"
run = "go mod tidy"

[tasks."backend:modules"]
dir = "backend"
run = "go mod download"
sources = [ "go.*" ]
outputs = { auto = true }

[tasks."backend:generate"]
run = """ogen --clean \
--target ./backend/api/server/publicapi \
--package publicapi \
--config ./backend/api/server/publicapi/.ogen.yml \
./api/publicapi.yml"""
sources = [
    "api/publicapi.yml",
    "backend/api/server/publicapi/.ogen.yml",
]
outputs = [ "backend/api/server/publicapi/*_gen.go" ]

[tasks."backend:templates"]
dir = "backend"
depends = [ "backend:modules" ]
run = "go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate"
sources = [ "**/*.templ", "go.*" ]
outputs = [ "**/*_templ.go" ]

# All Go consumers must wait until generators and embedded assets are ready.
[tasks."backend:prepare"]
depends = [ "backend:modules", "backend:generate", "backend:templates", "web:build" ]

[tasks."backend:build"]
dir = "backend"
depends = [ "backend:prepare" ]
run = "go build -trimpath -v -o ./bin/lumio ./cmd/lumio"
sources = [
    "**/*.go",
    "**/*.templ",
    "go.*",
    "data/migrations/*.up.sql",
    "internal/webui/dist/**/*",
    "internal/portfolio/viewer.js",
    "internal/portfolio/page.css",
]
outputs = [ "bin/lumio" ]

[tasks."web:modules"]
dir = "web"
run = "pnpm install --frozen-lockfile"
sources = [ "package.json", "pnpm-lock.yaml", ".npmrc", "pnpm-workspace.yaml" ]
outputs = [ "node_modules/.modules.yaml", "node_modules/.pnpm/lock.yaml" ]

[tasks."web:generate"]
dir = "web"
depends = [ "web:modules" ]
run = "pnpm run generate"
sources = [ "../api/publicapi.yml", "package.json", "pnpm-lock.yaml" ]
outputs = [ "src/api/schema.d.ts" ]

[tasks."web:build"]
dir = "web"
depends = [ "web:generate" ]
run = "pnpm run build"
sources = [
    "src/**/*",
    "public/**/*",
    "index.html",
    "tsconfig*.json",
    "vite.config.*",
    "package.json",
    "pnpm-lock.yaml",
]
outputs = [ "../backend/internal/webui/dist/index.html", "../backend/internal/webui/dist/**/*" ]

# Deployment

[tasks.secrets]
run = "sops k8s/prod/secret.enc.yaml"

[tasks.prerequisites]
confirm = { message = "Apply prerequisites?", yes = "Apply", no = "Cancel", default = "no" }
run = """
kustomize build --enable-alpha-plugins --enable-exec k8s/prod |\
  kubectl apply -f - -l app.kubernetes.io/component=prerequisite
kubectl rollout status deployment/postgres -n lumio --timeout=300s
kubectl rollout status deployment/garage -n lumio --timeout=300s
"""

[tasks.migrate]
confirm = { message = "Run migrations?", yes = "Migrate", no = "Cancel", default = "no" }
run = """
kubectl delete job/lumio-migrate -n lumio --ignore-not-found --wait=true
kustomize build --enable-alpha-plugins --enable-exec k8s/prod |\
  kubectl apply -f - -l app.kubernetes.io/component=migration
if ! kubectl wait --for=condition=complete job/lumio-migrate -n lumio --timeout=300s; then
  kubectl describe job/lumio-migrate -n lumio
  kubectl logs job/lumio-migrate -n lumio --all-containers
exit 1
fi
"""

[tasks."initialize-s3"]
confirm = { message = "Initialize S3 storage?", yes = "Init", no = "Cancel", default = "no" }
run = """
kubectl delete job/lumio-storage-init -n lumio --ignore-not-found --wait=true
kustomize build --enable-alpha-plugins --enable-exec k8s/prod |\
  kubectl apply -f - -l app.kubernetes.io/component=storage-init
if ! kubectl wait --for=condition=complete job/lumio-storage-init -n lumio --timeout=300s; then
  kubectl describe job/lumio-storage-init -n lumio
  kubectl logs job/lumio-storage-init -n lumio --all-containers
exit 1
fi
"""

[tasks.deploy]
confirm = { message = "Deploy to production?", yes = "Deploy", no = "Cancel", default = "no" }
run = """
kustomize build --enable-alpha-plugins --enable-exec k8s/prod | kubectl apply -f -
kubectl rollout status deployment/lumio-web -n lumio --timeout=300s
kubectl rollout status deployment/lumio-worker -n lumio --timeout=300s
"""

# Checks

[tasks.check]
depends = [ "test", "lint" ]

# Tests

[tasks.test]
depends = [ "backend:test:unit", "web:test" ]

[tasks."backend:test:unit"]
dir = "backend"
depends = [ "backend:prepare" ]
run = "go test ./..."

[tasks."backend:test:e2e"]
dir = "backend"
depends = [ "backend:prepare" ]
run = "go test -tags e2e ./test/e2e/..."

[tasks."backend:test:media"]
dir = "backend"
depends = [ "backend:build" ]
run = [
    "docker build -f Dockerfile.worker -t lumio-worker-test .",
    "go test -c -o bin/imaging.test ./internal/infrastructure/imaging",
    "docker run --rm -v $(pwd)/bin/imaging.test:/tests:ro --entrypoint /tests lumio-worker-test -test.v",
]

[tasks."web:test"]
dir = "web"
depends = [ "web:generate" ]
run = "pnpm run test"

# Linting

[tasks.lint]
depends = [ "backend:lint", "web:lint" ]

[tasks."backend:lint"]
dir = "backend"
depends = [ "backend:prepare" ]
run = [ "golangci-lint run" ]

[tasks."web:lint"]
dir = "web"
depends = [ "web:generate" ]
run = [ "pnpm run lint" ]

[tasks."k8s:lint"]
run = """
set -e
rendered=$(mktemp)
trap 'rm -f "$rendered"' EXIT
kubectl kustomize k8s/base > "$rendered"
kubeconform -strict -summary -ignore-missing-schemas "$rendered"
"""
sources = [
    "k8s/base/**/*",
]
