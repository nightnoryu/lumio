services:
  lumio-ingress:
    image: traefik:v3.7
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      lumio:
        condition: service_healthy
      lumio-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  lumio:
    build: backend
    environment: &lumio-environment
      LUMIO_S3_ENDPOINT: http://lumio-storage:3900
      LUMIO_S3_PUBLIC_ENDPOINT: http://localhost:3900
      LUMIO_S3_REGION: garage
      LUMIO_S3_ACCESS_KEY: ${LUMIO_S3_ACCESS_KEY:-GK11111111111111111111111111111111}
      LUMIO_S3_SECRET_KEY: ${LUMIO_S3_SECRET_KEY:-1111111111111111111111111111111111111111111111111111111111111111}
      LUMIO_DASHBOARD_ORIGIN: http://localhost:3000
      LUMIO_BASE_DOMAIN: localhost
      LUMIO_DB_HOST: lumio-db
      LUMIO_DB_PORT: 5432
      LUMIO_DB_NAME: lumio
      LUMIO_DB_USER: lumio
      LUMIO_DB_PASSWORD: ${LUMIO_DB_PASSWORD:-lumio-local-only}
      LUMIO_METRICS_ADDRESS: 0.0.0.0:9090
      LUMIO_DB_MAX_CONN: 10
      LUMIO_DB_CONN_LIFETIME: 60s
    volumes:
      - "./backend/bin/lumio:/app/bin/lumio:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lumio-api.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/preview/`) || Path(`/portfolio.js`) || Path(`/healthz`) || Path(`/livez`))"
      - "traefik.http.services.lumio-api.loadbalancer.server.port=8080"
      - "traefik.http.routers.lumio-public.rule=HostRegexp(`^[a-z0-9-]+\\.localhost$`)"
      - "traefik.http.routers.lumio-public.service=lumio-api"
      - "traefik.http.middlewares.lumio-compress.compress=true"
      - "traefik.http.middlewares.lumio-compress.compress.excludedcontenttypes=image/jpeg,image/png,image/webp"
      - "traefik.http.routers.lumio-api.middlewares=lumio-compress"
      - "traefik.http.routers.lumio-public.middlewares=lumio-compress"
    depends_on:
      lumio-storage-init:
        condition: service_completed_successfully
      lumio-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  lumio-worker:
    build:
      context: backend
      dockerfile: Dockerfile.worker
    environment: *lumio-environment
    volumes:
      - "./backend/bin/lumio:/app/bin/lumio:ro"
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    depends_on:
      lumio:
        condition: service_healthy
      lumio-storage-init:
        condition: service_completed_successfully

  lumio-storage-init:
    build: backend
    command: ["storage-init"]
    environment: *lumio-environment
    volumes:
      - "./backend/bin/lumio:/app/bin/lumio:ro"
    depends_on:
      lumio-db:
        condition: service_healthy
      lumio-storage:
        condition: service_healthy

  lumio-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumio
      POSTGRES_PASSWORD: ${LUMIO_DB_PASSWORD:-lumio-local-only}
      POSTGRES_DB: lumio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "lumio-db-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumio -d lumio"]
      interval: 5s
      timeout: 5s
      retries: 10

  lumio-storage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${LUMIO_S3_ACCESS_KEY:-GK11111111111111111111111111111111}
      GARAGE_DEFAULT_SECRET_KEY: ${LUMIO_S3_SECRET_KEY:-1111111111111111111111111111111111111111111111111111111111111111}
      GARAGE_DEFAULT_BUCKET: lumio
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - "lumio-storage-data:/data"
      - "./garage/compose.toml:/etc/garage.toml:ro"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  lumio-web:
    build: web
    volumes:
      - "./web:/app"
      - "/app/node_modules"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lumio-web.rule=Host(`localhost`)"
      - "traefik.http.services.lumio-web.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumio-db-data:
  lumio-storage-data:
