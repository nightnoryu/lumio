openapi: 3.0.3
info:
  title: Lumio public API
  version: 0.1.0
paths:
  /api/status:
    get:
      operationId: getStatus
      summary: Application status
      responses:
        '200':
          description: Application is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
