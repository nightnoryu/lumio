openapi: 3.0.3
info:
  title: Lumio public API
  version: 0.3.0
  description: |
    Pilot identity, site and private photography API. Requests use the configured dashboard host.
    Login and registration set a host-only Secure HttpOnly SameSite=Strict
    __Host-lumio-session cookie with Path=/. All writes require the exact
    dashboard Origin. Authenticated writes additionally require X-CSRF-Token
    from getMe. Password reset tokens are issued by an operator, expire after
    30 minutes and revoke all sessions when redeemed.

paths:
  /api/status:
    get:
      operationId: getStatus
      summary: Application status
      responses:
        '200':
          description: Application is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        default:
          $ref: '#/components/responses/Error'

  /api/auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '204':
          description: Success
        default:
          $ref: '#/components/responses/Error'

  /api/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '204':
          description: Success
        default:
          $ref: '#/components/responses/Error'

  /api/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Success
        default:
          $ref: '#/components/responses/Error'

  /api/auth/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '204':
          description: Success
        default:
          $ref: '#/components/responses/Error'

  /api/auth/me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viewer'
        default:
          $ref: '#/components/responses/Error'

  /api/sites:
    get:
      operationId: listSites
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sites'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        default:
          $ref: '#/components/responses/Error'

  /api/sites/{id}:
    get:
      operationId: getSite
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: renameSite
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        default:
          $ref: '#/components/responses/Error'

  /api/sites/{id}/photos:
    get:
      operationId: listPhotos
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photos"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUpload
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"

  /api/sites/{id}/photos/{photoId}:
    delete:
      operationId: deletePhoto
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: photoId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Success
        default:
          $ref: "#/components/responses/Error"

  /api/sites/{id}/photos/{photoId}/complete:
    post:
      operationId: completeUpload
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: photoId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Success
        default:
          $ref: "#/components/responses/Error"

  /api/sites/{id}/photos/{photoId}/preview:
    get:
      operationId: previewPhoto
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: photoId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Error"

  /api/sites/{id}/draft:
    get:
      operationId: getDraft
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Private draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveDraft
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Draft'}
      responses:
        '200':
          description: Private draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        default:
          $ref: '#/components/responses/Error'

  /api/sites/{id}/publication:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPublication
      responses:
        '200':
          description: Publication state and canonical URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Publication'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: publishSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Published saved draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Publication'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: unpublishSite
      responses:
        '204':
          description: Unpublished
        default:
          $ref: '#/components/responses/Error'

components:
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128}

    Registration:
      type: object
      required: [email, password, invitation]
      properties:
        email: {type: string, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128}
        invitation: {type: string, minLength: 26, maxLength: 26}

    PasswordReset:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 26, maxLength: 26}
        password: {type: string, minLength: 12, maxLength: 128}

    Viewer:
      type: object
      required: [id, email, csrfToken, baseDomain]
      properties:
        id: {type: string}
        email: {type: string}
        csrfToken: {type: string}
        baseDomain: {type: string}

    SiteInput:
      type: object
      required: [slug]
      properties:
        slug: {type: string, minLength: 1, maxLength: 100}

    Site:
      type: object
      required: [id, slug, createdAt]
      properties:
        id: {type: string}
        slug: {type: string}
        createdAt: {type: string, format: date-time}

    Sites:
      type: array
      items:
        $ref: '#/components/schemas/Site'

    UploadInput:
      type: object
      required: [name, contentType, size, watermark]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
        size: {type: integer, format: int64, minimum: 1}
        watermark: {type: string, maxLength: 80}

    Photo:
      type: object
      required: [id, name, status, width, height, size]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string}
        width: {type: integer}
        height: {type: integer}
        size: {type: integer, format: int64}

    Photos:
      type: array
      items: {$ref: '#/components/schemas/Photo'}

    Upload:
      description: |
        PUT the file bytes directly to url with Content-Type matching the upload
        request and If-None-Match set to *. The URL expires after 15 minutes.
        Call complete after upload; a completed upload is verified, promoted to
        durable private storage, then queued for validation and processing.
      type: object
      required: [id, url]
      properties:
        id: {type: string}
        url: {type: string}

    Preview:
      type: object
      required: [url]
      properties:
        url: {type: string}

    Draft:
      type: object
      required: [version, displayName, biography, location, specialization, profilePhoto, coverPhoto, template, typography, colour, layout, photos, services, contacts, hidePrices]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        language: {type: string, enum: [en, ru], default: en}
        seoTitle: {type: string, maxLength: 120}
        seoDescription: {type: string, maxLength: 300}
        displayName: {type: string, maxLength: 120}
        biography: {type: string, maxLength: 4000}
        location: {type: string, maxLength: 160}
        specialization: {type: string, maxLength: 160}
        profilePhoto: {type: string, maxLength: 36}
        coverPhoto: {type: string, maxLength: 36}
        template: {type: string, enum: [gallery, editorial]}
        typography: {type: string, enum: [serif, sans]}
        colour: {type: string, enum: [light, dark, warm]}
        layout: {type: string, enum: [grid, column]}
        hidePrices: {type: boolean}
        photos:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DraftPhoto'}
        services:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/PortfolioService'}
        contacts:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/Contact'}

    DraftPhoto:
      type: object
      required: [id, alt, category]
      properties:
        id: {type: string, format: uuid}
        alt: {type: string, maxLength: 300}
        category: {type: string, maxLength: 80}

    PortfolioService:
      type: object
      required: [name, description, price]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 1000}
        price: {type: string, maxLength: 100}

    Contact:
      type: object
      required: [label, url]
      properties:
        label: {type: string, minLength: 1, maxLength: 60}
        url: {type: string, minLength: 1, maxLength: 500}

    Publication:
      type: object
      required: [published, version, url]
      properties:
        published: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        url: {type: string}
