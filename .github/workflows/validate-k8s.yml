name: Validate Kubernetes Manifests

on:
  pull_request:
    paths: &k8s-paths
      - 'k8s/base/**'
      - 'mise.toml'
      - '.github/workflows/validate-k8s.yml'
  push:
    branches: [ main ]
    paths: *k8s-paths

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Validate base manifests
        run: mise run k8s:lint
