name: Validate Kubernetes Manifests

on:
  pull_request:
    paths: &k8s-paths
      - 'k8s/base/**'
      - '.github/workflows/validate-k8s.yml'
  push:
    branches: [ main ]
    paths: *k8s-paths

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Build kustomization
        run: kubectl kustomize k8s/base > rendered.yaml

      - name: Validate base manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            rendered.yaml
