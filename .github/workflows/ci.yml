name: CI

on:
  pull_request:
    paths: &code-paths
      - 'backend/**'
      - 'web/**'
      - 'mise.toml'
      - '.github/workflows/ci.yml'
  push:
    branches: [ main ]
    paths: *code-paths

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run full build
        run: mise run
