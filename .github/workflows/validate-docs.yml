name: Validate Markdown

on:
  pull_request:
    paths: &docs-paths
      - 'README.md'
      - 'docs/**'
      - 'mise.toml'
      - '.github/workflows/validate-docs.yml'
  push:
    branches: [ main ]
    paths: *docs-paths

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Lint Markdown
        run: mise run docs:lint
