version: "2"

run:
  timeout: 5m
  issues-exit-code: 1

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - importas
    - dogsled
    - dupl
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - revive
    - gosec
    - misspell
    - nakedret
    - prealloc
    - unconvert
    - whitespace
    - rowserrcheck
    - goconst
    - asciicheck
    - nestif
    - copyloopvar
    - sqlclosecheck
    - errorlint
    - nilerr
    - exhaustive
    - contextcheck
    - testifylint
    - forcetypeassert
    - unparam

  settings:
    govet:
      enable:
        - shadow

    gocritic:
      disabled-checks:
        - sloppyReassign
        - whyNoLint
      enabled-tags:
        - experimental
        - opinionated

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: '_test\.go'
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
    - gci

  settings:
    goimports:
      local-prefixes:
        - lumio

    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(lumio/)

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
